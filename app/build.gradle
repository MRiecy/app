plugins {
    id 'com.android.application'
    id 'com.google.dagger.hilt.android'
}

android {
    signingConfigs {
        debug {
            storeFile file('D:\\MedicineVendingMachine\\app\\key\\androidkey.jks')
            storePassword 'android123'
            keyPassword 'android123'
            keyAlias 'androidkey'
        }
        release {
            storeFile file('D:\\MedicineVendingMachine\\app\\key\\androidkey.jks')
            keyAlias 'androidkey'
            storePassword 'android123'
            keyPassword 'android123'
        }
    }
    namespace 'com.jianjia.medicinevendingmachine'
    compileSdk 33

    defaultConfig {
        applicationId "com.jianjia.medicinevendingmachine"
        minSdk 21
        targetSdk 33
        versionCode 60
        versionName "2.1"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }
    buildFeatures {
        viewBinding = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    configurations {
        configureEach {
            exclude group: 'org.json', module: 'json'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_9
        targetCompatibility JavaVersion.VERSION_1_9
    }

    android.applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            def date = new Date().format("yyyyMMdd", TimeZone.getTimeZone("GMT+08"))
            if (variant.buildType.name == 'debug') {
                outputFileName = "debug_jianjia_yaoshi_device_V${variant.versionName}_${date}.apk"
            }
            if (variant.buildType.name == 'release') {
                outputFileName = "release_jianjia_yaoshi_device_V${variant.versionName}_${date}.apk"
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'], exclude: [])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.tonystark.android:socket:4.2.3'
    implementation 'org.xutils:xutils:3.8.12'
    implementation 'com.alibaba:fastjson:1.2.75'
    implementation 'com.elvishew:xlog:1.11.0'
    implementation 'com.iqiyi.xcrash:xcrash-android-lib:3.1.0'
    implementation "androidx.room:room-runtime:2.5.1"
    annotationProcessor "androidx.room:room-compiler:2.5.1"
    implementation "androidx.room:room-rxjava3:2.5.1"
    implementation 'com.google.dagger:hilt-android:2.45'
    annotationProcessor 'com.google.dagger:hilt-compiler:2.45'
    implementation "androidx.work:work-runtime:2.8.1"
    implementation 'androidx.hilt:hilt-work:1.0.0'
    annotationProcessor 'androidx.hilt:hilt-compiler:1.0.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}