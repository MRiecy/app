<script>
var activeIndex = 0
var isPlay = false
var swiper1 =null
function close(){
  $('.bottomMenu').stop().toggle();
  $('#val').val('');
 } 


// 定时器
var closeTime;
function closeTimeFun(){
  closeTime = setTimeout(function(){
  close();
  },15000);
}

var clearTimeHome;
function timeOutGoHome() {
  clearTimeout(closeTime)
  clearTimeout(clearTimeHome)
  clearTimeHome = setTimeout(function(){
    $('.alertModel').hide();
    $('.telval').show();
    $('.btn').show();
    if(swiper1){
      swiper1.startAutoplay();
      swiper1.slideNext();
    }
  },15000);
}


  // 页面跳转逻辑
  function togglePage(status) {
    if(swiper1){
      swiper1.stopAutoplay();
      var video = document.getElementById(`videokey${activeIndex}`);
      if(video){
          video.pause()
          isPlay= false
      }
    }
  if (status == 1){
    // 正在处理，显示正在处理界面
    $('.bottomMenu,.index .content1 .btn').hide();
    $('.alertModel .status1').show().siblings().hide();

    $('.telval').hide();
    $('.alertModel').show() ;
  }
  if (status == 2){
    // 订单不存在，显示不存在页面
    $('.bottomMenu,.index .content1 .btn').hide();
    $('.alertModel .status2').show().siblings().hide();

    $('.telval').hide();
    $('.alertModel').show() ;
    timeOutGoHome();
  }
  if (status == 3){
    // 获取订单信息失败，显示订单信息失败页
    $('.bottomMenu,.index .content1 .btn').hide();
    $('.alertModel .status3').show().siblings().hide();

    $('.telval').hide();
    $('.alertModel').show() ;
    timeOutGoHome();
  }
  if (status == 4){
    // 出货中，调用出货中的页面
    $('.bottomMenu,.index .content1 .btn').hide();
    $('.alertModel .on').show().siblings().hide();

    $('.telval').hide();
    $('.alertModel').show() ;
  }
  if (status == 5){
      // 出货失败页面
      $('.bottomMenu,.index .content1 .btn').hide();
      $('.alertModel .fail').show().siblings().hide();
      
      $('.telval').hide();
      $('.alertModel').show();
      timeOutGoHome();
  }
  if (status == 6){
      // 部分出货失败页面
      $('.bottomMenu,.index .content1 .btn').hide();
      $('.alertModel .fail2').show().siblings().hide();
      
      $('.telval').hide();
      $('.alertModel').show();
      timeOutGoHome();
  }
  if (status == 7){
      // 成功页面
      $('.bottomMenu,.index .content1 .btn').hide();
      $('.alertModel .succeed').show().siblings().hide();
      
      $('.telval').hide();
      $('.alertModel').show();
      timeOutGoHome();
  }
}

// 供java调用
function setSwiper(result) {
  try {
    if(result.length>0) {
      var dataList =result.map(function(item){
        let obj = item
        obj.url  = '/storage/emulated/0/NewWebFile/BannerImg/'+obj.url 
        return obj
      })
      dataList.unshift({
        // 类型 1图片 2视频
        type:"1",
        // 资源地址
        url:"images/wapimg1.png",
      })
      var html = '<div class="swiper-container"><div class="swiper-wrapper">'
        dataList.forEach(function(item,i) {
          if(item.type ==1){
            html +=
            `<div class="swiper-slide">
              <div class="imgbox" id="imgkey${i}">
                <div class="img pc" style="background: url(${item.url}) no-repeat center center;"></div>
                <div class="img wap" style="background: url(${item.url}) no-repeat center center;"></div>
              </div>
            </div>`
          }else{
            html +=
            `<div class="swiper-slide">
              <div class="videobox">
                <div class="play_btn" id="play_${i}" ></div>
                <video class="video" controls width="100%" src="${item.url}" id="videokey${i}" muted>
                  <source src="${item.url}" type="video/mp4" width="100%">
                </video>
              </div>
            </div>`
          }
        });
      html +='</div></div>'
      $('#swiperBox').html(html) 
        swiper1 = new Swiper('.floating .swiper-container',{
        pagination: '.floating .swiper-pagination',
        paginationClickable: '.floating .swiper-pagination',
        nextButton: '.floating .swiper-button-next',
        prevButton: '.floating .swiper-button-prev',
        autoplay:5000,
        autoplayDisableOnInteraction: false,
        speed:700,
        slidesPerView: 1,
        spaceBetween: 0,
          loop:true,//无缝衔接滚动
          // effect:'cube',//滑动效果
          observer:true,//修改swiper自己或子元素时，自动初始化swiper
          observeParents:true,//修改swiper的父元素时，自动初始化swiper
          autoplayDisableOnInteraction:false,//用户操作swiper之后不禁止autoplay
          lazyLoading:true,//图片延迟加载
          lazyLoadingInPrevNext:true,//前一个和后一个延迟加载
          onClick:function(v){
            var video = document.getElementById(`videokey${activeIndex}`);
            if(video){
              if(!isPlay){
                video.play()
                swiper1.stopAutoplay();
              }else{
                video.pause()
              }
            }
          }
      })
      swiper1.on('SlideChangeStart',function (e) {
        activeIndex =swiper1.realIndex
        var video = document.getElementById(`videokey${activeIndex}`);
        if(video){
          video.play()
          swiper1.stopAutoplay();
        }else{
          swiper1.startAutoplay();
        }
      })
      // 监听视频播放完成
      $('.videobox video').on('ended', function () {
        isPlay= false
        console.log('播放完成')
        swiper1.startAutoplay();
        swiper1.slideNext();
      })
      // 暂停播放
      $('.videobox video').on('pause', function () {
        console.log('暂停播放')
        isPlay= false
        setTimeout(function(){
          swiper1.startAutoplay();
          swiper1.slideNext();
        },1000)
      })

      // 提示该视频正在播放中
      $('.videobox video').on('play', function () {
        console.log('提示该视频正在播放中')
        isPlay= true
        swiper1.stopAutoplay();
      })
      // 视频出错了
      $('.videobox video').on('error', function () {
        console.log('视频出错了')
        isPlay= false
        swiper1.startAutoplay();
        swiper1.slideNext();
      })
    }
  }catch(e) {
    // alert('格式有误');
    console.log(e);
  }
}
